# Serves the Vite-built demo UI and proxies /api/ to the API service so the
# browser talks to a single origin (no CORS, no baked-in API host).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Vite emits content-hashed filenames under /assets/: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The built bundle calls the API with the relative base /api/v1.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must revalidate so new deploys pick up new hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
