# kind cluster for proving the Milestone 11 manifests locally.
#
#   kind create cluster --name formless --config infra/k8s/kind-config.yaml
#
# - Maps the node's port 80 to the host's port 80 so the ingress-nginx
#   controller is reachable at http://localhost/ (with an explicit Host header
#   matching the Ingress rule).
# - Labels the node `ingress-ready=true`, which the upstream kind deployment
#   manifest of ingress-nginx uses for its nodeSelector.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
