# Template for the API's secrets. The committed default is keyless: an empty
# OPENAI_API_KEY keeps the app in its documented no-key mode (health, schema
# catalogue, journal, and record endpoints serve; ingestion and query answer
# 503 unless MODEL_MODE=fake, which the local overlay sets).
#
# For a real deployment, replace the value before applying — never commit a
# real key:
#
#   kubectl -n formless create secret generic formless-api-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: formless-api-secrets
  labels:
    app.kubernetes.io/part-of: formless
type: Opaque
stringData:
  OPENAI_API_KEY: ''
