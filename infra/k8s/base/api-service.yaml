# Port 3000 is fixed: the web image's nginx config proxies /api/ to
# `http://api:3000` (apps/web/nginx.conf), so the Service name and port must
# stay `api:3000` unless that file changes too.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: formless-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: formless
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: formless-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
