# Milestone 12 CI/CD: quality gates, GHCR image publishing, and a kind smoke
# proof of the Milestone 11 manifests on every change.
#
# Pipeline shape (per change):
#   verify      lint -> typecheck -> unit/contract tests -> workspace build
#   images      build the Milestone 9 Dockerfiles, push to ghcr.io tagged by
#               commit SHA (GITHUB_TOKEN only, no custom secrets)
#   kind-smoke  load the exact built images into a kind cluster, apply the
#               local overlay, wait for readiness, assert API health (+ the
#               keyless ingestion/query path), tear the cluster down
#
# Observability (same milestone): the API exposes Prometheus metrics on
# /api/v1/metrics; monitoring manifests live in infra/k8s/base/monitoring and
# are applied through the infra/k8s/overlays/monitoring overlay.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the repo's pinned `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit, contract, and UI tests: network-free and database-free by
      # design (integration tests self-skip without TEST_DATABASE_URL).
      - name: Unit tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

  images:
    name: Build and push images to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image paths.
      - id: meta
        name: Compute GHCR image prefix
        run: >-
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}'
          | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The pipeline's only credential: the workflow-scoped GITHUB_TOKEN
      # GitHub provides by default. No custom secrets are required.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.prefix }}/formless-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.prefix }}/formless-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Push tagged by the full commit SHA (immutable reference per change).
      # Fork pull requests run with a read-only GITHUB_TOKEN and cannot push
      # packages; the smoke test still runs on the built images via artifacts.
      - name: Push images
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker push "${{ steps.meta.outputs.prefix }}/formless-api:${{ github.sha }}"
          docker push "${{ steps.meta.outputs.prefix }}/formless-web:${{ github.sha }}"

      # Hand the exact built images to the smoke job without a registry round
      # trip, so the proof is byte-for-byte what this run built and pushed.
      - name: Save images for the smoke job
        run: |
          mkdir -p image-artifacts
          docker save --output image-artifacts/api.tar \
            "${{ steps.meta.outputs.prefix }}/formless-api:${{ github.sha }}"
          docker save --output image-artifacts/web.tar \
            "${{ steps.meta.outputs.prefix }}/formless-web:${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: image-artifacts/*.tar
          retention-days: 1
          if-no-files-found: error

  kind-smoke:
    name: Kind smoke test (local overlay)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: images
          path: image-artifacts

      - name: Load images and retag for the local overlay
        run: |
          docker load --input image-artifacts/api.tar
          docker load --input image-artifacts/web.tar
          PREFIX="${{ needs.images.outputs.prefix }}"
          docker tag "$PREFIX/formless-api:${{ github.sha }}" formless-api:latest
          docker tag "$PREFIX/formless-web:${{ github.sha }}" formless-web:latest

      # Same kind version the local proof (Milestone 11) is validated with.
      - name: Install kind
        run: |
          curl --fail --silent --show-error --location \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 --output kind
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      # Creates the cluster, installs ingress-nginx, applies
      # infra/k8s/overlays/local, waits for deployments, asserts
      # /api/v1/health plus the keyless ingestion/query path through the
      # ingress, and tears the cluster down unless KEEP_CLUSTER=1.
      - name: Prove the manifests end to end
        run: infra/k8s/scripts/local-verify.sh --skip-build

      # The script tears the cluster down on success; this catches failures.
      - name: Tear down the kind cluster
        if: always()
        run: kind delete cluster --name formless || true
